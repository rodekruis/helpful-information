<app-parent-link
  [label]="$safeNavigationMigration(offer?.subCategoryName)"
></app-parent-link>

<article class="ion-margin-vertical">
  <app-offer
    [offer]="offer"
    [regionData]="regionData"
  ></app-offer>
</article>

<br />

<app-last-updated-time class="ion-margin-vertical"></app-last-updated-time>

<br />

<app-feedback-link
  [template]="$safeNavigationMigration(regionData?.feedbackShareUrl)"
  [labels]="{
    answerNegative: $safeNavigationMigration(
      regionData?.feedbackAnswerNegative
    ),
    answerPositive: $safeNavigationMigration(
      regionData?.feedbackAnswerPositive
    ),
    question: $safeNavigationMigration(regionData?.feedbackQuestion),
    resultNegative: $safeNavigationMigration(
      regionData?.feedbackResultNegative
    ),
    resultPostive: $safeNavigationMigration(regionData?.feedbackResultPostive),
    shareCta: $safeNavigationMigration(regionData?.feedbackShareCta),
    thanks: $safeNavigationMigration(regionData?.feedbackThanks),
  }"
></app-feedback-link>
