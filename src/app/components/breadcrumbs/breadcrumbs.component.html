<nav aria-label="Breadcrumbs">
  <ol class="list-flat list-inline ion-no-margin">
    <li>
      @if (item?.categoryID) {
        <a
          [routerLink]="[baseUrl, $safeNavigationMigration(item?.categorySlug)]"
          (click)="click($safeNavigationMigration(item?.categorySlug))"
          class="text-style--inline-link is_minimal"
          >{{ item?.categoryName || item?.categoryID }}</a
        >
      }
      @if (!item?.subCategoryID) {
        <strong aria-hidden="true">&nbsp;: </strong>
      }
    </li>
    @if (item?.subCategoryID) {
      <li>
        <strong aria-hidden="true">&nbsp;/ </strong>
        @if (item?.subCategoryID) {
          <a
            [routerLink]="[
              baseUrl,
              $safeNavigationMigration(item?.categorySlug),
              $safeNavigationMigration(item?.subCategorySlug),
            ]"
            (click)="
              click(
                $safeNavigationMigration(item?.categorySlug),
                $safeNavigationMigration(item?.subCategorySlug)
              )
            "
            class="text-style--inline-link is_minimal"
            >{{ item?.subCategoryName || item?.subCategoryID }}</a
          >
        }
        <strong aria-hidden="true">&nbsp;: </strong>
      </li>
    }
  </ol>
</nav>
