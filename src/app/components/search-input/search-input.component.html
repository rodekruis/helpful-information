<form
  role="search"
  #ngForm
  (ngSubmit)="doSubmit()"
  class="search-input"
>
  <span class="search-input--input">
    <input
      type="search"
      name="q"
      [(ngModel)]="searchQuery"
      enterkeyhint="search"
      class="input-field--text text-style--size-1"
    />

    @if (!!searchQuery) {
      <button
        type="button"
        class="input-field--clear"
        [title]="clearLabel || 'Clear'"
        (click)="searchQuery = ''; doSubmit(); ngForm.q.focus()"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          class="input-field--clear-icon"
        >
          <path
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2.25"
            d="M7 7l10 10M17 7 7 17"
          />
        </svg>
      </button>
    }
  </span>

  <button
    type="submit"
    class="search-input--action action is_round is_inline is_outline is_primary"
  >
    <strong>
      {{ actionLabel || 'Search' }}
    </strong>
  </button>
</form>
